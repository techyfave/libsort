services:
  - type: web
    name: libsort-api
    runtime: python
    plan: free
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: libsort-db
          property: connectionString
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SEED_DEMO_DATA
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
databases:
  - name: libsort-db
    plan: free
    databaseName: libsort
    user: libsort
